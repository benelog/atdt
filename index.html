<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>갈무리 보관소 — 이야기 5.3</title>
<meta name="description" content="PC통신 시절 갈무리한 글을 옛 통신 프로그램 '이야기 5.3' 화면처럼 보여주는 곳">
<link rel="stylesheet" href="css/iyagi.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="dos" hidden></div>
    <div id="splash" hidden>
      <div class="wall"></div>
      <div class="floor"></div>
      <div class="desk"></div>
      <div class="monitor"><div class="scr"><span>ATDT 5551996<br>CONNECT 19200</span></div></div>
      <div class="stand"></div>
      <div class="pc"></div>
      <div class="modem"><i></i><i></i></div>
      <div class="win">
        <div class="ttl">이 야 기   5 . 3</div>
        <div class="gbox">갈무리 보관소<br><small>PC통신 갈무리 글 보기 · 이야기 5.3 화면 재현</small></div>
        <div class="rbox">이 화면은 큰사람의 '이야기 5.3'(1992)을 본떠 새로 만든 재현물이며<br>큰사람과는 관계가 없습니다.</div>
        <div class="msg">아무 글쇠나 누르십시오 . . .</div>
      </div>
    </div>
    <div id="screen"></div>
    <div id="status"></div>
    <div id="editor" hidden><div id="etext"></div><div id="estat"></div></div>
    <div id="menubar" hidden></div>
    <div id="layer" hidden></div>
    <input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="통신 입력">
  </div>
</div>
<div id="softkeys">
  <button data-k="F10">차림표 F10</button>
  <button data-act="dial">전화 걸기</button>
  <button data-k="F5">챙긴글 F5</button>
  <button data-k="B">이전 B</button>
  <button data-k="Enter">다음 ↵</button>
  <button data-k="L">목록 L</button>
  <button data-act="kbd">⌨ 자판</button>
</div>
<script src="js/posts.js"></script>
<script src="js/term.js"></script>
<script src="js/host.js"></script>
<script src="js/app.js"></script>
</body>
</html>
